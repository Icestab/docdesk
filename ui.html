<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地文档台</title>
<style>
:root{--bg:#0e1116;--panel:#161b23;--line:#252c38;--text:#d8dde6;--dim:#7b8494;
--accent:#7aa2f7;--accent2:#9ece6a;--danger:#f7768e;--warn:#e0af68}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
font:15px/1.65 system-ui,-apple-system,"Noto Sans SC","Source Han Sans SC",sans-serif}
header{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;
padding:10px 18px;background:rgba(14,17,22,.94);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand b{font-size:15px;letter-spacing:.4px}
.tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;
padding:2px 8px;margin-left:8px;white-space:nowrap}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stat{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
button{font:inherit;font-size:13px;color:var(--text);background:var(--panel);
border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;
transition:.15s border-color,.15s color,.15s background}
button:hover{border-color:#3a4456}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:#20304d;border-color:#2f4570;color:#cfe0ff}
button.danger{background:#3a1f27;border-color:#5c2b36;color:#ffc6d0}
select{font:inherit;font-size:13px;background:var(--panel);color:var(--text);
border:1px solid var(--line);border-radius:8px;padding:6px 8px}
main{max-width:900px;margin:0 auto;padding:22px 18px 210px}
.drop{border:1.5px dashed #2f3949;border-radius:16px;padding:44px 20px;text-align:center;
background:linear-gradient(180deg,#131821,#0f131a);transition:.15s;margin-top:9vh}
.drop.over{border-color:var(--accent);background:#141d2c}
.drop .big{font-size:17px;margin-bottom:6px}
.drop .hint{font-size:12px;color:var(--dim);margin-bottom:16px}
.hidden{display:none!important}
.docs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);
border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;max-width:100%}
.chip b{font-weight:600;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip span{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.msg{margin:0 0 22px}
.msg .who{font-size:11px;color:var(--dim);letter-spacing:.6px;text-transform:uppercase;
margin-bottom:6px;display:flex;gap:8px;align-items:center}
.msg.user .body{background:#182130;border:1px solid #22304a;border-radius:12px;
padding:10px 14px;white-space:pre-wrap;word-break:break-word}
.msg.bot .body{white-space:normal}
.msg.bot .body p{margin:0 0 10px}
.msg.bot .body h3{font-size:15px;margin:16px 0 8px;color:#eaf0ff}
.msg.bot .body ul,.msg.bot .body ol{margin:0 0 10px;padding-left:22px}
.msg.bot .body li{margin:3px 0}
.msg.bot .body code{background:#1d2430;border-radius:5px;padding:1px 5px;font-size:13px}
.msg.bot .body pre{background:#12171f;border:1px solid var(--line);border-radius:10px;
padding:12px;overflow:auto;font-size:13px}
.msg.bot .body table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px}
.msg.bot .body th,.msg.bot .body td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.msg.bot .body th{background:#1a212c}
.cite{display:inline-block;font-size:10px;line-height:1.5;color:#9dbcff;background:#182236;
border:1px solid #2b3d5e;border-radius:5px;padding:0 4px;margin:0 2px;cursor:pointer;
vertical-align:super;font-variant-numeric:tabular-nums}
.cite:hover{background:#22314d}
.src{margin-top:10px;font-size:12px;color:var(--dim)}
.src summary{cursor:pointer;color:#8b95a7;font-size:12px}
.src ol{margin:8px 0 0;padding-left:20px}
.src li{margin:4px 0;line-height:1.5}
.src li b{color:#aeb9c9;font-weight:600}
.src .snip{display:block;color:#78828f;margin-top:2px;max-height:4.5em;overflow:hidden}
.stage{font-size:12px;color:var(--warn);margin:6px 0;font-variant-numeric:tabular-nums}
.err{font-size:13px;color:var(--danger);background:#2a161c;border:1px solid #4a212b;
border-radius:8px;padding:8px 12px;margin-top:8px}
footer{position:fixed;left:0;right:0;bottom:0;padding:10px 18px 12px;
background:linear-gradient(180deg,rgba(14,17,22,0),rgba(14,17,22,.96) 26%)}
footer .inner{max-width:900px;margin:0 auto}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.presets button{font-size:12px;padding:4px 10px;border-radius:999px;color:#a9b3c3}
.input-row{display:flex;gap:8px;align-items:flex-end}
textarea#q{flex:1;resize:none;min-height:46px;max-height:180px;padding:11px 14px;
background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;
font:inherit;outline:none}
textarea#q:focus{border-color:#3a4d70}
#send{height:46px;padding:0 20px}
.foot{font-size:11px;color:#5d6675;margin-top:6px;text-align:center}
@media(max-width:640px){main{padding:14px 12px 230px}
header{padding:8px 12px}.chip b{max-width:140px}
.presets{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>本地文档台</b><span class="tag">离线 · 不落盘</span></div>
  <div class="hdr-right">
    <span id="stat" class="stat">未加载模型</span>
    <select id="mode" title="自动：文档小就全文，大就检索">
      <option value="auto">自动</option>
      <option value="full">全文</option>
      <option value="retrieve">检索</option>
    </select>
    <button id="shred" class="danger" title="清空内存里的所有文档并关闭服务">销毁并退出</button>
  </div>
</header>
<main>
  <section id="drop" class="drop">
    <div class="big">把文件拖进来，或点击选择</div>
    <div class="hint">PDF · Word · Excel · txt / md / csv · 图片 · 可以一次选多个<br>
      扫描件/照片会自动走 OCR（300 dpi，本机 CPU）<br>
      文件只在内存里解析，不写磁盘，不联网</div>
    <button id="pick" class="primary">选择文件</button>
    <button id="paste" style="margin-left:8px">粘贴文本</button>
  </section>
  <section id="docs" class="docs hidden"></section>
  <section id="chat"></section>
</main>
<footer id="composer" class="hidden">
  <div class="inner">
    <div class="presets">
      <button data-preset="summary">全文摘要</button>
      <button data-preset="points">要点清单</button>
      <button data-preset="timeline">时间线</button>
      <button data-preset="risks">风险/义务</button>
      <button data-preset="numbers">数字与期限</button>
      <button data-preset="actions">待办事项</button>
      <button data-preset="qa">先问什么</button>
      <button id="addmore">＋ 加文件</button>
    </div>
    <div class="input-row">
      <textarea id="q" rows="1" placeholder="就这些文件问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="send" class="primary">发送</button>
    </div>
    <div class="foot">聊到的东西只在这台机器的内存里；刷新页面记录即消失，关机则全部销毁。</div>
  </div>
</footer>
<input id="file" type="file" multiple class="hidden">
<script>
const $=s=>document.querySelector(s);
const state={docs:[],total:0,busy:false};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmtTok=n=>n>=1000?(n/1000).toFixed(1)+'k':String(n);
function inline(s){
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  return s.replace(/\[(\d{1,3})\]/g,'<span class="cite" data-n="$1">$1</span>');
}
function md(src){
  const L=esc(src).split('\n'); let out=[],i=0,buf=[];
  const flush=()=>{if(buf.length){out.push('<p>'+inline(buf.join('<br>'))+'</p>');buf=[]}};
  while(i<L.length){
    const ln=L[i];
    if(/^```/.test(ln)){flush();i++;let code=[];
      while(i<L.length&&!/^```/.test(L[i]))code.push(L[i++]);i++;
      out.push('<pre>'+code.join('\n')+'</pre>');continue}
    if(/^\s*\|.*\|\s*$/.test(ln)){flush();let rows=[];
      while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i]))rows.push(L[i++]);
      const tr=rows.map((r,ri)=>{const c=r.trim().replace(/^\||\|$/g,'').split('|');
        if(ri===1&&c.every(x=>/^\s*:?-{2,}:?\s*$/.test(x)))return '';
        const tag=ri===0?'th':'td';
        return '<tr>'+c.map(x=>'<'+tag+'>'+inline(x.trim())+'</'+tag+'>').join('')+'</tr>'}).join('');
      out.push('<table>'+tr+'</table>');continue}
    if(/^#{1,4}\s/.test(ln)){flush();out.push('<h3>'+inline(ln.replace(/^#+\s*/,''))+'</h3>');i++;continue}
    if(/^\s*([-*+]|\d+\.)\s/.test(ln)){flush();let items=[];
      while(i<L.length&&/^\s*([-*+]|\d+\.)\s/.test(L[i]))
        items.push('<li>'+inline(L[i++].replace(/^\s*([-*+]|\d+\.)\s+/,''))+'</li>');
      out.push('<ul>'+items.join('')+'</ul>');continue}
    if(!ln.trim()){flush();i++;continue}
    buf.push(ln);i++;
  }
  flush();return out.join('\n');
}
const scrollBottom=()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
function setStat(t){$('#stat').textContent=t}
function renderDocs(){
  const box=$('#docs');
  if(!state.docs.length){box.classList.add('hidden');$('#drop').classList.remove('hidden');
    $('#composer').classList.add('hidden');setStat('未加载文档');return}
  box.classList.remove('hidden');$('#drop').classList.add('hidden');
  $('#composer').classList.remove('hidden');
  box.innerHTML=state.docs.map(d=>'<div class="chip"><b>'+esc(d.name)+'</b><span>'
    +d.pages+'页 · '+fmtTok(d.tokens)+' tok</span></div>').join('');
  setStat(state.docs.length+' 个文件 · '+fmtTok(state.total)+' tok');
}
function addMsg(role,text){
  const el=document.createElement('div');el.className='msg '+role;
  el.innerHTML='<div class="who">'+(role==='user'?'你':'本地模型')+'</div><div class="body"></div>';
  const b=el.querySelector('.body');
  b.innerHTML=role==='user'?esc(text):md(text);
  $('#chat').appendChild(el);scrollBottom();return el;
}
async function upload(files){
  for(const f of files){
    if(!f.size)continue;
    const note=addMsg('bot','正在解析 **'+f.name+'** …');
    try{
      const b64=await new Promise((ok,no)=>{const r=new FileReader();
        r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=no;r.readAsDataURL(f)});
      const res=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:f.name,b64:b64})});
      const j=await res.json();
      if(!res.ok)throw new Error(j.error||'解析失败');
      state.docs=j.docs;state.total=j.total_tokens;renderDocs();
      note.remove();
      const a=j.added;
      let msg='已载入 **'+a.name+'**：'+a.pages+' 页，约 '+fmtTok(a.tokens)+' tok';
      if(a.ocr)msg+='。其中 **'+a.ocr+' 页是 OCR 识别**，形近字可能错（期末/期未），引用原文前请核对';
      if(a.scanned&&a.scanned.length)msg+='。还有 '+a.scanned.length+' 页没认出文字（第 '+a.scanned.slice(0,8).join('、')+' 页）';
      addMsg('bot',msg);
    }catch(e){note.querySelector('.body').innerHTML='<div class="err">'+esc(e.message)+'</div>'}
  }
}
$('#pick').onclick=()=>$('#file').click();
$('#addmore').onclick=()=>$('#file').click();
$('#file').onchange=e=>{upload([...e.target.files]);e.target.value=''};
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{
  e.preventDefault();$('#drop').classList.add('over')}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{
  e.preventDefault();$('#drop').classList.remove('over')}));
document.addEventListener('drop',e=>{
  if(e.dataTransfer&&e.dataTransfer.files.length)upload([...e.dataTransfer.files])});
function b64utf8(s){
  const u=new TextEncoder().encode(s);let bin='';
  for(let i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
  return btoa(bin);
}
async function addTextDoc(name,text){
  const note=addMsg('bot','正在解析 **'+name+'** …');
  try{
    const res=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name,b64:b64utf8(text)})});
    const j=await res.json();
    if(!res.ok)throw new Error(j.error||'解析失败');
    state.docs=j.docs;state.total=j.total_tokens;renderDocs();note.remove();
    addMsg('bot','已载入 **'+j.added.name+'**：约 '+fmtTok(j.added.tokens)+' tok');
  }catch(e){note.querySelector('.body').innerHTML='<div class="err">'+esc(e.message)+'</div>'}
}
$('#paste').onclick=()=>{
  const w=document.createElement('div');
  w.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:flex;align-items:center;justify-content:center;padding:18px';
  w.innerHTML='<div style="background:#161b23;border:1px solid #252c38;border-radius:14px;padding:16px;width:min(700px,100%)">'
    +'<div style="margin-bottom:8px;font-size:13px;color:#9aa4b2">粘贴文本（只在内存里）</div>'
    +'<textarea id="pt" style="width:100%;height:250px;background:#0e1116;color:#d8dde6;border:1px solid #252c38;border-radius:10px;padding:10px;font:inherit"></textarea>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">'
    +'<button id="pc">取消</button><button id="pok" class="primary">分析</button></div></div>';
  document.body.appendChild(w);
  const ta=w.querySelector('#pt');ta.focus();
  w.querySelector('#pc').onclick=()=>w.remove();
  w.querySelector('#pok').onclick=()=>{
    const t=ta.value.trim();if(!t)return;w.remove();
    addTextDoc('粘贴文本-'+new Date().toTimeString().slice(0,8)+'.txt',t);
  };
};
const PRESET_LABEL={summary:'全文摘要',points:'要点清单',timeline:'时间线',risks:'风险/义务',
  numbers:'数字与期限',actions:'待办事项',qa:'先问什么'};
async function ask(preset,text){
  if(state.busy||!state.docs.length)return;
  text=(text||'').trim();
  if(!preset&&!text)return;
  state.busy=true;$('#send').disabled=true;
  addMsg('user',text||PRESET_LABEL[preset]||'');
  const el=addMsg('bot','');const body=el.querySelector('.body');
  body.innerHTML='<div class="stage">准备资料…</div>';
  let acc='',sources=[],last=0;
  const paint=()=>{body.innerHTML=md(acc)}; 
  try{
    const url=preset==='summary'?'/api/summary':'/api/chat';
    const payload={question:text,mode:$('#mode').value};
    if(preset&&preset!=='summary')payload.preset=preset;
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)});
    if(!res.ok){
      const j=await res.json().catch(()=>({error:'HTTP '+res.status}));
      throw new Error(j.error||('HTTP '+res.status));
    }
    const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
    while(true){
      const {value,done}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      let cut;
      while((cut=buf.indexOf('\n\n'))>=0){
        const raw=buf.slice(0,cut);buf=buf.slice(cut+2);
        for(const line of raw.split('\n')){
          if(!line.startsWith('data:'))continue;
          let ev;try{ev=JSON.parse(line.slice(5).trim())}catch(_){continue}
          if(ev.type==='meta'){sources=ev.sources||[];
            if(!acc)body.innerHTML='<div class="stage">资料 '+(ev.tokens||0)+' tok · '+(ev.mode==='full'?'全文':ev.mode==='retrieve'?'检索':'分段摘要')+'</div>';
            continue}
          if(ev.type==='stage'){if(!acc)body.innerHTML='<div class="stage">'+esc(ev.text)+'</div>';continue}
          if(ev.type==='delta'){acc+=ev.text;
            const now=Date.now();if(now-last>55){last=now;paint()}
            continue}
          if(ev.type==='error'){throw new Error(ev.text||'模型出错')}
        }
      }
    }
    if(acc){body.innerHTML=md(acc);clipCites(body,sources.length);renderSources(el,sources)}
    else body.innerHTML='<div class="err">模型没有返回内容</div>';
  }catch(e){
    body.innerHTML=(acc?md(acc):'')+'<div class="err">'+esc(e.message||String(e))+'</div>';
  }finally{
    state.busy=false;$('#send').disabled=false;$('#q').focus();
  }
}
function renderSources(el,sources){
  if(!sources||!sources.length)return;
  let li='';
  for(const s of sources)
    li+='<li id="src-'+s.n+'"><b>'+esc(s.doc)+'</b> · '+esc(s.label)
      +'<span class="snip">'+esc(s.preview||'')+'</span></li>';
  const box=document.createElement('div');box.className='src';
  box.innerHTML='<details><summary>来源 '+sources.length+' 处（点引用编号可跳转）</summary><ol>'+li+'</ol></details>';
  el.appendChild(box);
}
function clipCites(root,n){
  root.querySelectorAll('.cite').forEach(c=>{
    if(+c.dataset.n>n){
      const s=document.createElement('span');s.textContent='['+c.dataset.n+']';
      c.replaceWith(s);
    }
  });
}
$('#chat').addEventListener('click',e=>{
  const c=e.target.closest('.cite');if(!c)return;
  const msg=c.closest('.msg');const det=msg&&msg.querySelector('.src details');
  if(det)det.open=true;
  const li=msg&&msg.querySelector('#src-'+c.dataset.n);
  if(li){li.scrollIntoView({block:'center'});li.style.color='#dbe6ff';
    setTimeout(()=>{li.style.color=''},1200)}
});
function autoGrow(){const t=$('#q');t.style.height='auto';t.style.height=Math.min(180,t.scrollHeight)+'px'}
$('#q').addEventListener('input',autoGrow);
$('#send').onclick=()=>{const t=$('#q').value;$('#q').value='';autoGrow();ask(null,t)};
$('#q').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#send').click()}
});
document.querySelectorAll('.presets button[data-preset]').forEach(b=>{
  b.onclick=()=>{const t=$('#q').value;$('#q').value='';autoGrow();ask(b.dataset.preset,t)};
});
$('#shred').onclick=async()=>{
  if(!confirm('清空所有文档和聊天记录，并关闭本地服务？'))return;
  try{await fetch('/api/close',{method:'POST'})}catch(_){}
  document.body.innerHTML='<div style="padding:60px 20px;text-align:center;color:#7b8494;font-size:14px">'
    +'已销毁：内存清空，服务已退出。这个页面可以关掉了。</div>';
};
(async()=>{
  if(location.search.indexOf('t=')>=0){try{history.replaceState(null,'','/')}catch(_){}}
  try{
    const r=await fetch('/api/state');const j=await r.json();
    state.docs=j.docs||[];state.total=j.total_tokens||0;renderDocs();
  }catch(_){setStat('服务未就绪')}
})();
</script>
</body>
</html>
